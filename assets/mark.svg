<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="updatool">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/><stop offset="1" stop-color="#111C33"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#60A5FA"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10B981"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <!-- two slots: blue (previous) and green (live) -->
  <rect x="26" y="70" width="58" height="16" rx="8" fill="url(#blue)" opacity=".45"/>
  <rect x="26" y="42" width="58" height="16" rx="8" fill="url(#green)"/>
  <!-- the switch: an upward arrow from the old slot to the new one -->
  <path d="M98 88V40" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round"/>
  <path d="M86 52l12-14 12 14" fill="none" stroke="#E5E7EB" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="34" cy="50" r="3.5" fill="#052E1F"/>
</svg>
